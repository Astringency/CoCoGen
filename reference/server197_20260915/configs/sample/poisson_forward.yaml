    num_time_steps: 2000
    eps: 1e-5
    residual_config:
      target: physics.operators.Helmholtz
      params:
        dx: 0.0078125
        k: 0.0
        eps: 1e-8
        mu_p: 0.0
        sigma_p: 0.02739726
        mu_k: 0.0
        sigma_k: 2.5
