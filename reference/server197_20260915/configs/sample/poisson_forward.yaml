batch_size: 20
device: 0
data:
  pde_name: poisson
  # data_dir: /large_storage/zhangxf/PDEdata/poisson/poisson_10000-128-128_1.mat
  data_dir: /large_storage/zhangxf/PDEdata/test1125/poisson_test_1000-128-128.mat
  batch_size: 32
  num_workers: 8
sensors:
  target: sensors.sensors_new.coefRandom
  params:
    sensors: 500
sampler_config:
  target: sdes.backward.ProbabilityFlowODEPhysics
